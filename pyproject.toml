[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "clause-lens-server"
version = "0.1.0"
requires-python = ">=3.11"
description = "MCP server for contract clause retrieval — Clause Lens"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]
